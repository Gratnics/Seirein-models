[model]
name = "black-forest-labs/FLUX.2-dev"
display_name = "FLUX.2 [dev]"
family = "FLUX.2"
provider = "Together AI"
release_date = "2025-11-22"
commercial_use = "NO - FLUX [dev] Non-Commercial License only"

[resolution]
max = "1920x1920 (up to 4MP per model page)"
min = "256x256"
arbitrary_resolution = true
aspect_ratio_control = false

[input]
file_upload = true
max_input_context = "32K characters (verbatim on model page)"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "steps, guidance; example steps=20; no documented range/default"

[output]
batch_supported = true

[pricing]
input = "undocumented"
output = "$0.0154/image"

[sources]
urls = ["https://www.together.ai/models/flux-2-dev", "https://www.together.ai/blog/flux-2-multi-reference-image-generation-now-available-on-together-ai", "https://docs.together.ai/docs/serverless/models", "https://docs.together.ai/docs/quickstart-flux"]
