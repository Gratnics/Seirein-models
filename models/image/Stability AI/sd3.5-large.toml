[model]
name = "sd3.5-large"
display_name = "Stable Diffusion 3.5 Large"
family = "Stable Diffusion 3.5"
provider = "Stability AI"
release_date = "2024-10-22"
commercial_use = "Open-weight, Community License: free non-commercial + <$1M/yr revenue; Enterprise License above. Hosted API: pay-per-credit, Stability ToS"

[resolution]
max = "1 megapixel (default 1024x1024)"
min = "undocumented"
