[settings]
has_level_settings = true
level_param_values = "cfg_scale (1-10, default 4); style_preset"

[output]
batch_supported = false

[pricing]
input = "n/a"
output = "6.5 credits/gen ($0.065)"

[sources]
urls = ["https://platform.stability.ai/docs/api-reference", "https://platform.stability.ai/pricing", "https://stability.ai/news-updates/introducing-stable-diffusion-3-5", "https://stability.ai/license"]
