[model]
name = "sd3.5-flash"
display_name = "SD3.5-Flash"
family = "Stable Diffusion 3.5"
provider = "Stability AI"
release_date = "2025-09-26 (year inferred from arXiv id 2509.21318 linked from official research page)"
commercial_use = "Distilled SD3.5 Medium; open-weight Community License framework"

[resolution]
max = "1 megapixel (default 1024x1024)"
min = "undocumented"
arbitrary_resolution = false
aspect_ratio_control = true

[input]
file_upload = true
max_input_context = "prompt 1-10,000 chars; negative_prompt <=10,000 chars"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "cfg_scale (1-10, default 1); style_preset; fixed 4-step distilled (vs 40 for Medium)"

[output]
batch_supported = false

[pricing]
input = "n/a"
output = "2.5 credits/gen ($0.025)"

[sources]
urls = ["https://platform.stability.ai/docs/api-reference", "https://platform.stability.ai/pricing", "https://stability.ai/research/sd35-flash-distribution-guided-distillation-of-generative-flows"]
