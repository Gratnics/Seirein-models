[model]
name = "grok-imagine-image-2.0"
display_name = "Grok Imagine Image 2.0"
family = "Grok Imagine"
provider = "xAI"
release_date = "2026-08-07"
commercial_use = "allowed (customer/user owns Output; per xAI Enterprise ToS, no IP indemnification provided)"

[resolution]
max = "2k"
min = "1k"
arbitrary_resolution = false
aspect_ratio_control = true

[input]
file_upload = true
max_input_context = "undocumented"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "resolution: 1k, 2k | aspect_ratio: 1:1, 3:4, 4:3, 9:16, 16:9, 2:3, 3:2, 9:19.5, 19.5:9, 9:20, 20:9, 1:2, 2:1, auto"

[output]
batch_supported = true

[pricing]
input = "undocumented (flat per-image pricing regardless of prompt length)"
output = "$0.04 per image"

[sources]
urls = ["https://docs.x.ai/developers/models/grok-imagine-image-2.0", "https://docs.x.ai/developers/model-capabilities/imagine", "https://docs.x.ai/developers/rest-api-reference/inference/images", "https://x.ai/news/grok-imagine-image-2", "https://docs.x.ai/developers/models"]
