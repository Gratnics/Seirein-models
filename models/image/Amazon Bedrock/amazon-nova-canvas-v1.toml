[model]
name = "amazon.nova-canvas-v1:0"
display_name = "Amazon Nova Canvas"
family = "Nova Canvas"
provider = "Amazon Bedrock"
release_date = "2024-12-03"
commercial_use = "Available under Amazon Bedrock service terms"

[resolution]
max = "2048x2048"
min = "320x320"
arbitrary_resolution = false
aspect_ratio_control = true

[input]
file_upload = true
max_input_context = "up to 1 reference image"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "cfgScale: 1.1-10; seed; quality: standard|premium; negativeText; maskPrompt"

[output]
batch_supported = false

[pricing]
input = "undocumented"
output = "See Amazon Bedrock pricing"

[sources]
urls = ["https://docs.aws.amazon.com/bedrock/latest/userguide/model-card-amazon-nova-canvas.html", "https://docs.aws.amazon.com/nova/latest/userguide/image-gen-access.html"]
