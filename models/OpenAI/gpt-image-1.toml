[model]
name = "gpt-image-1"
display_name = "GPT Image 1"
family = "GPT Image"
provider = "OpenAI"
release_date = "undocumented"
commercial_use = "Same terms as gpt-image-2"

[resolution]
max = "1536x1024 or 1024x1536"
min = "1024x1024"
arbitrary_resolution = false
aspect_ratio_control = true

[input]
file_upload = true
max_input_context = "32,000 characters"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "quality: 'low'|'medium'|'high'|'auto'; input_fidelity: 'low'|'high'; moderation: 'low'|'auto'"

[output]
batch_supported = true

[pricing]
input = "Text $5.00/1M ($1.25 cached); Image $10.00/1M ($2.50 cached); Batch: Text $2.50/1M ($0.63 cached), Image $5.00/1M ($1.25 cached)"
output = "$40.00/1M image output tokens (standard) / $20.00/1M (Batch); per-image Low $0.011-$0.016, Medium $0.042-$0.063, High $0.167-$0.25"

[sources]
urls = ["https://developers.openai.com/api/docs/models/gpt-image-1", "https://developers.openai.com/api/docs/pricing", "https://openai.com/index/image-generation-api/"]
