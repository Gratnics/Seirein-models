[settings]
has_level_settings = true
level_param_values = "guidance: 1.5-10 (default 5); steps: 1-50 (default 50); safety_tolerance: 0-5 (default 2)"

[output]
batch_supported = false

[pricing]
input = "undocumented"
output = "from $0.05/MP"

[sources]
urls = ["https://docs.bfl.ai/api-reference/models/generate-or-edit-an-image-with-flux2-[flex]", "https://docs.bfl.ml/quick_start/pricing", "https://docs.bfl.ai/release-notes"]
