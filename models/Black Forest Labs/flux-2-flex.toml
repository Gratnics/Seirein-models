[model]
name = "flux-2-flex"
display_name = "FLUX.2 [flex]"
family = "FLUX.2"
provider = "Black Forest Labs"
release_date = "2025-11-25"
commercial_use = "Proprietary API-only; commercial use permitted via paid API"

[resolution]
max = "4 megapixels"
min = "64x64 pixels"
arbitrary_resolution = true
aspect_ratio_control = false

[input]
