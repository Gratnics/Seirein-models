[model]
name = "stable-image-ultra"
display_name = "Stable Image Ultra"
family = "Stable Image / Stable Diffusion 3.5"
provider = "Stability AI"
release_date = "2024-06-05 (initial); updated to SD3.5 Large on 2024-10-29"
commercial_use = "Permitted; Stability ToS assigns Output ownership to user; paid per-credit API, not subject to $1M open-weight threshold"

[resolution]
max = "1 megapixel (default 1024x1024)"
min = "undocumented"
arbitrary_resolution = false
aspect_ratio_control = true

[input]
file_upload = true
max_input_context = "prompt 1-10,000 chars; negative_prompt <=10,000 chars"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "style_preset enum (3d-model, analog-film, anime, cinematic, comic-book, digital-art, enhance, fantasy-art, isometric, line-art, low-poly, modeling-compound, neon-punk, origami, photographic, pixel-art, tile-texture); strength (0-1, img2img only)"

[output]
batch_supported = false

[pricing]
input = "n/a (per-generation credits)"
output = "8 credits/gen ($0.08); failed gens not charged"

[sources]
urls = ["https://platform.stability.ai/docs/api-reference", "https://platform.stability.ai/pricing", "https://platform.stability.ai/docs/release-notes", "https://stability.ai/terms-of-service"]
