[model]
name = "stable-diffusion-xl-1024-v1-0"
display_name = "Stable Diffusion XL 1.0"
family = "SDXL"
provider = "Stability AI"
release_date = "2023-07-26"
commercial_use = "Still listed/priced on official Pricing page (Aug 2026) as 'Legacy'; Stability ToS for hosted use"

[resolution]
max = "1536x640 / 640x1536 (~0.98MP)"
min = "128x128 (multiple of 64); default 512x512"
arbitrary_resolution = false
aspect_ratio_control = "undocumented (no aspect_ratio param; fixed height/width combos: 1024x1024, 1152x896, 896x1152, 1216x832, 1344x768, 768x1344, 1536x640, 640x1536)"

[input]
file_upload = "undocumented (separate legacy endpoints per engine; only text-to-image doc confirmed this session)"
max_input_context = "text_prompts array of weighted prompt objects, no char cap documented"
prompt_format = "natural_language"

[settings]
has_level_settings = true
level_param_values = "steps (10-50, default 30); cfg_scale (0-35, default 7); sampler enum (DDIM, DDPM, K_DPMPP_2M, K_DPMPP_2S_ANCESTRAL, K_DPM_2, K_DPM_2_ANCESTRAL, K_EULER, K_EULER_ANCESTRAL, K_HEUN, K_LMS); clip_guidance_preset; style_preset"

[output]
batch_supported = true

[pricing]
input = "n/a"
output = "0.9 credits/gen at <=30 steps ($0.009); scales with steps/30 above that"

[sources]
urls = ["https://platform.stability.ai/docs/api-reference", "https://platform.stability.ai/pricing", "https://platform.stability.ai/docs/release-notes"]
